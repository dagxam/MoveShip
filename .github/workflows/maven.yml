name: Сборка плагина MoveShip

on:
  push:
    branches: ["main", "master", "fix/ship-core-paper-26"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ☕ Настройка Java 26 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Проверка сборки
        run: mvn -B clean package --file pom.xml

      - name: 📦 Сохранение готового .jar файла
        uses: actions/upload-artifact@v4
        with:
          name: MoveShip-Plugin
          path: target/MoveShip-1.0-SNAPSHOT.jar
